<!DOCTYPE html>
<html>
<head>
  <title>My Orders</title>
</head>

<body style="font-family:sans-serif; padding:20px;">

<h1>📦 My Orders</h1>
<div id="ordersList"></div>

<button onclick="goBack()">Back</button>

<script>

let user = JSON.parse(localStorage.getItem("checkoutCart")) || [];
let email = "";

if(localStorage.length > 0){
  email = Object.keys(localStorage).find(k => k.includes("@") && k.includes("_orders"));
}

let orders = JSON.parse(localStorage.getItem(email)) || [];

let container = document.getElementById("ordersList");

if(orders.length === 0){
  container.innerHTML = "No orders yet";
} else {
  orders.forEach(order => {
    let div = document.createElement("div");

    let html = "<strong>Time:</strong> " + order.time + "<br>";
    html += "<strong>Total:</strong> ₹" + order.total + "<br>";

    order.items.forEach(item => {
      html += item.name + " x " + item.qty + "<br>";
    });

    div.innerHTML = html;
    container.appendChild(div);
  });
}

function goBack(){
  window.location.href = "home.html";
}

</script>

</body>
</html>

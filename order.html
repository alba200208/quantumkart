<!DOCTYPE html>
<html>
<head>
  <title>Orders</title>
</head>

<body>

<h2>Your Orders</h2>
<ul id="orders"></ul>

<script type="module">

import { auth } from "./firebase.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

let currentUser;

let testUser = localStorage.getItem("testUser");

if(testUser){
  currentUser = { email: testUser };
  loadOrders();
} else {
  onAuthStateChanged(auth, (user)=>{
    currentUser = user;
    loadOrders();
  });
}

function loadOrders(){

  let list = document.getElementById("orders");

  // 🔥 USER BASED KEY
  let key = currentUser.email + "_orders";

  let orders = JSON.parse(localStorage.getItem(key)) || [];

  list.innerHTML = "";

  if(orders.length === 0){
    list.innerHTML = "<p>No orders yet</p>";
    return;
  }

  orders.forEach(order => {

    let li = document.createElement("li");

    let items = order.items.map(i => i.name + " x " + i.qty).join(", ");

    li.innerHTML = `
      ${items} <br>
      <small>${order.date}</small>
      <hr>
    `;

    list.appendChild(li);
  });
}

</script>

</body>
</html>

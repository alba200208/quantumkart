<!DOCTYPE html>
<html>
<head>
  <title>My Orders</title>

  <style>
    body {
      font-family: sans-serif;
      background: #f1f3f6;
      padding: 20px;
    }

    h1 {
      text-align: center;
    }

    .order {
      background: white;
      padding: 15px;
      margin: 15px 0;
      border-radius: 10px;
    }

    button {
      padding: 10px;
      background: orange;
      border: none;
      cursor: pointer;
    }
  </style>
</head>

<body>

<h1>📦 My Orders</h1>

<div id="ordersList"></div>

<br>
<button onclick="goBack()">⬅ Back</button>

<script>

let user = localStorage.getItem("user");
let orders = JSON.parse(localStorage.getItem(user + "_orders")) || [];

const container = document.getElementById("ordersList");

if(orders.length === 0){
  container.innerHTML = "<p>No orders yet</p>";
} else {

  orders.forEach(order => {
    let div = document.createElement("div");
    div.className = "order";

    let html = "<strong>Time:</strong> " + order.time + "<br>";
    html += "<strong>Total:</strong> ₹" + order.total + "<br><br>";

    order.items.forEach(item => {
      html += item.name + " x " + item.qty + "<br>";
    });

    div.innerHTML = html;
    container.appendChild(div);
  });

}

function goBack(){
  window.location.href = "home.html";
}

</script>

</body>
</html>

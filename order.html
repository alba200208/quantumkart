<!DOCTYPE html>
<html>
<head>
  <title>Your Orders</title>
  <style>
    body {
      font-family: Arial;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
    }

    .order-card {
      background: white;
      padding: 15px;
      margin: 15px auto;
      width: 80%;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .item {
      margin: 5px 0;
    }

    .total {
      font-weight: bold;
      margin-top: 10px;
    }

    .date {
      color: gray;
      font-size: 14px;
    }

    .back {
      display: block;
      margin: 20px auto;
      padding: 10px 20px;
      background: black;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<h1>🧾 Your Orders</h1>

<div id="orders"></div>

<button class="back" onclick="goBack()">⬅ Back to Home</button>

<script>
const user = localStorage.getItem("user");
const allOrders = JSON.parse(localStorage.getItem("orders")) || {};
const orders = allOrders[user] || [];

const container = document.getElementById("orders");

if (orders.length === 0) {
  container.innerHTML = "<p style='text-align:center;'>No Orders Yet</p>";
} else {
  orders.reverse().forEach(order => {

    let itemsHTML = "";

    order.items.forEach(item => {
      itemsHTML += `<div class="item">• ${item.name} x ${item.qty}</div>`;
    });

    const div = document.createElement("div");
    div.className = "order-card";

    div.innerHTML = `
      <div class="date">📅 ${order.date}</div>
      ${itemsHTML}
      <div class="total">💰 Total: ₹${order.total}</div>
    `;

    container.appendChild(div);
  });
}

function goBack(){
  window.location.href = "home.html";
}
</script>

</body>
</html>

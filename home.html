<!DOCTYPE html>
<html>
<head>
  <title>QuantumKart Pro</title>
</head>

<body>

<h2>🛒 QuantumKart</h2>

<div>
  <span id="userEmail"></span>
  <button onclick="goOrders()">Orders</button>
  <button onclick="logout()">Logout</button>
</div>

<hr>

<div>
  <button onclick="addToCart('T-Shirt',500)">T-Shirt ₹500</button><br>
  <button onclick="addToCart('Watch',1500)">Watch ₹1500</button><br>
  <button onclick="addToCart('Shoes',2500)">Shoes ₹2500</button>
</div>

<h3>Cart</h3>
<ul id="cartList"></ul>
<p id="total"></p>
<button onclick="buyNow()">Buy Now</button>

<script type="module">

import { auth, logoutUser } from "./firebase.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

let cart = [];
let currentUser = null;

// Check manual login first
let testUser = localStorage.getItem("testUser");

if(testUser){
  currentUser = { email: testUser };
  startApp(currentUser);
} else {

  onAuthStateChanged(auth, (user) => {
    if(user){
      currentUser = user;
      startApp(user);
    } else {
      window.location.href = "index.html";
    }
  });

}

function startApp(user){
  document.getElementById("userEmail").innerText = user.email;

  let saved = localStorage.getItem(user.email + "_cart");
  cart = saved ? JSON.parse(saved) : [];

  displayCart();
}

function saveCart(){
  localStorage.setItem(currentUser.email + "_cart", JSON.stringify(cart));
}

function addToCart(name, price){
  let item = cart.find(p => p.name === name);

  if(item) item.qty++;
  else cart.push({name, price, qty:1});

  saveCart();
  displayCart();
}

function displayCart(){
  let list = document.getElementById("cartList");
  let total = 0;

  list.innerHTML = "";

  cart.forEach((item) => {
    total += item.price * item.qty;

    let li = document.createElement("li");
    li.innerText = item.name + " x " + item.qty;
    list.appendChild(li);
  });

  document.getElementById("total").innerText = "Total: ₹" + total;
}

function buyNow(){
  localStorage.setItem("checkoutCart", JSON.stringify(cart));
  window.location.href = "payment.html";
}

function goOrders(){
  window.location.href = "order.html";
}

function logout(){
  localStorage.removeItem("testUser");
  logoutUser().then(() => {
    window.location.href = "index.html";
  });
}

window.addToCart = addToCart;
window.buyNow = buyNow;
window.goOrders = goOrders;
window.logout = logout;

</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <title>QuantumKart</title>

  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      background: #f1f3f6;
    }

    header {
      background: #232f3e;
      color: white;
      padding: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header button {
      margin-left: 10px;
      padding: 8px 12px;
      border: none;
      cursor: pointer;
      border-radius: 5px;
      background: orange;
      font-weight: bold;
    }

    .container {
      display: flex;
      padding: 20px;
      gap: 20px;
    }

    .products {
      flex: 2;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .card {
      background: white;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
      transition: 0.3s;
    }

    .card:hover {
      transform: scale(1.05);
    }

    img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 10px;
    }

    button {
      margin-top: 10px;
      padding: 8px;
      background: orange;
      border: none;
      cursor: pointer;
      border-radius: 5px;
      font-weight: bold;
    }

    .cart {
      flex: 1;
      background: white;
      padding: 15px;
      border-radius: 10px;
    }

    .qty-btn {
      margin: 0 5px;
      padding: 3px 8px;
      background: #ddd;
      border-radius: 4px;
    }

    .buy {
      width: 100%;
      background: green;
      color: white;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<header>
  <h2>🛒 QuantumKart</h2>
  <div>
    <button onclick="goOrders()">Orders</button>
  </div>
</header>

<div class="container">

  <!-- PRODUCTS -->
  <div class="products">

    <div class="card">
      <img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=400">
      <h3>T-Shirt</h3>
      <p>₹500</p>
      <button onclick="addToCart('T-Shirt',500)">Add to Cart</button>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400">
      <h3>Watch</h3>
      <p>₹1500</p>
      <button onclick="addToCart('Watch',1500)">Add to Cart</button>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400">
      <h3>Shoes</h3>
      <p>₹2500</p>
      <button onclick="addToCart('Shoes',2500)">Add to Cart</button>
    </div>

  </div>

  <!-- CART -->
  <div class="cart">
    <h2>🛒 Cart</h2>
    <ul id="cartList"></ul>
    <h3 id="total">Total: ₹0</h3>
    <button class="buy" onclick="buyNow()">Buy Now</button>
  </div>

</div>

<script>

// LOAD CART
let cart = JSON.parse(localStorage.getItem("cart")) || [];

// SAVE CART
function saveCart() {
  localStorage.setItem("cart", JSON.stringify(cart));
}

// ADD TO CART
function addToCart(name, price) {
  let item = cart.find(p => p.name === name);

  if(item){
    item.qty++;
  } else {
    cart.push({name, price, qty:1});
  }

  saveCart();
  displayCart();
}

// CHANGE QTY
function changeQty(index, change) {
  cart[index].qty += change;

  if(cart[index].qty <= 0){
    cart.splice(index,1);
  }

  saveCart();
  displayCart();
}

// DISPLAY CART
function displayCart() {
  const list = document.getElementById("cartList");
  const total = document.getElementById("total");

  list.innerHTML = "";
  let sum = 0;

  cart.forEach((item, index) => {
    sum += item.price * item.qty;

    const li = document.createElement("li");

    li.innerHTML = `
      ${item.name} - ₹${item.price} x ${item.qty}
      <button class="qty-btn" onclick="changeQty(${index}, -1)">-</button>
      <button class="qty-btn" onclick="changeQty(${index}, 1)">+</button>
    `;

    list.appendChild(li);
  });

  total.innerText = "Total: ₹" + sum;
}

// BUY NOW + SAVE ORDER
function buyNow() {
  if(cart.length === 0){
    alert("Cart empty!");
    return;
  }

  let orders = JSON.parse(localStorage.getItem("orders")) || [];

  orders.push({
    items: cart,
    time: new Date().toLocaleString()
  });

  localStorage.setItem("orders", JSON.stringify(orders));

  alert("Order placed 🎉");

  cart = [];
  saveCart();
  displayCart();
}

// GO TO ORDERS PAGE
function goOrders(){
  window.location.href = "order.html";
}

// LOAD ON START
displayCart();

</script>

</body>
</html>

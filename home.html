<!DOCTYPE html>
<html>
<head>
  <title>QuantumKart</title>

  <style>
    body { font-family: Arial; padding: 20px; }

    .product {
      border: 1px solid #ccc;
      padding: 10px;
      margin: 10px 0;
      border-radius: 8px;
    }

    button {
      padding: 5px 10px;
      margin-top: 5px;
      cursor: pointer;
    }

    .cart {
      margin-top: 20px;
      border-top: 2px solid black;
      padding-top: 10px;
    }
  </style>
</head>

<body>

<h1>🛒 QuantumKart</h1>

<p id="userText"></p>

<h3>Products</h3>

<div class="product">
  <h4>Shoes ₹2500</h4>
  <button onclick="add('Shoes',2500)">Add to Cart</button>
</div>

<div class="product">
  <h4>T-Shirt ₹500</h4>
  <button onclick="add('T-Shirt',500)">Add to Cart</button>
</div>

<div class="product">
  <h4>Watch ₹1500</h4>
  <button onclick="add('Watch',1500)">Add to Cart</button>
</div>

<div class="cart">
  <h3>Cart</h3>
  <div id="cartItems"></div>
  <h4>Total: ₹<span id="total">0</span></h4>
  <button onclick="buy()">Buy Now</button>
</div>

<button onclick="window.location.href='order.html'">Orders</button>
<button onclick="logout()">Logout</button>

<script>
let user = localStorage.getItem("user");

if(!user){
  window.location.href = "index.html";
}

document.getElementById("userText").innerText = "Logged in as: " + user;

let cart = JSON.parse(localStorage.getItem("cart_" + user)) || [];

function saveCart(){
  localStorage.setItem("cart_" + user, JSON.stringify(cart));
}

function add(name, price){
  let item = cart.find(p => p.name === name);

  if(item){
    item.qty++;
  } else {
    cart.push({name, price, qty:1});
  }

  saveCart();
  render();
}

function changeQty(name, change){
  let item = cart.find(p => p.name === name);

  if(item){
    item.qty += change;

    if(item.qty <= 0){
      cart = cart.filter(p => p.name !== name);
    }
  }

  saveCart();
  render();
}

function render(){
  let html = "";
  let total = 0;

  cart.forEach(p => {
    total += p.price * p.qty;

    html += `
      <div>
        ${p.name} ₹${p.price} x ${p.qty}
        <button onclick="changeQty('${p.name}',1)">+</button>
        <button onclick="changeQty('${p.name}',-1)">-</button>
      </div>
    `;
  });

  document.getElementById("cartItems").innerHTML = html;
  document.getElementById("total").innerText = total;
}

function buy(){
  if(cart.length === 0){
    alert("Cart empty!");
    return;
  }

  window.location.href = "payment.html";
}

function logout(){
  localStorage.removeItem("user");
  window.location.href = "index.html";
}

render();
</script>

</body>
</html>

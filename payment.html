<!DOCTYPE html>
<html>
<head>
  <title>Payment</title>
</head>

<body style="font-family:sans-serif; display:flex;justify-content:center;align-items:center;height:100vh;">

<div>
  <h2>💳 Payment</h2>
  <p id="total"></p>

  <input placeholder="Card"><br>
  <input placeholder="Name"><br>
  <input placeholder="Expiry"><br>
  <input placeholder="CVV"><br>

  <button onclick="pay()">Pay</button>
</div>

<script>

let cart = JSON.parse(localStorage.getItem("checkoutCart")) || [];
let total = 0;

cart.forEach(i => total += i.price * i.qty);
document.getElementById("total").innerText = "Total: ₹" + total;

function pay(){

  let emailKey = Object.keys(localStorage).find(k => k.includes("_cart"));
  let userEmail = emailKey.replace("_cart","");

  let orders = JSON.parse(localStorage.getItem(userEmail + "_orders")) || [];

  orders.push({
    items: cart,
    total: total,
    time: new Date().toLocaleString()
  });

  localStorage.setItem(userEmail + "_orders", JSON.stringify(orders));

  localStorage.removeItem("checkoutCart");
  localStorage.removeItem(userEmail + "_cart");

  alert("Payment success 🎉");
  window.location.href = "order.html";
}

</script>

</body>
</html>

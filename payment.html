<!DOCTYPE html>
<html>
<head>
  <title>Payment - QuantumKart</title>
  <style>
    body {
      font-family: Arial;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .box {
      background: white;
      padding: 25px;
      border-radius: 10px;
      width: 320px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }
    h2 {
      text-align: center;
    }
    input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    button {
      width: 100%;
      padding: 10px;
      background: green;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover {
      background: darkgreen;
    }
  </style>
</head>

<body>

<div class="box">
  <h2>💳 Payment</h2>

  <p><b>Total: ₹<span id="totalAmount">0</span></b></p>

  <input placeholder="Card Number">
  <input placeholder="Card Holder Name">
  <input placeholder="Expiry (MM/YY)">
  <input placeholder="CVV">

  <button onclick="pay()">Pay Now</button>
</div>

<script>
  let user = localStorage.getItem("user");
  let cart = JSON.parse(localStorage.getItem("cart_" + user)) || [];

  let total = 0;
  cart.forEach(item => total += item.price * item.qty);

  document.getElementById("totalAmount").innerText = total;

  function pay() {
    if(cart.length === 0){
      alert("Cart empty!");
      return;
    }

    let orders = JSON.parse(localStorage.getItem("orders_" + user)) || [];

    let order = {
      items: cart,
      total: total,
      date: new Date().toLocaleString()
    };

    orders.push(order);

    localStorage.setItem("orders_" + user, JSON.stringify(orders));

    // clear cart
    localStorage.removeItem("cart_" + user);

    alert("Payment Successful 🎉");

    window.location.href = "order.html";
  }
</script>

</body>
</html>

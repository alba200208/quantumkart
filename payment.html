<!DOCTYPE html>
<html>
<head>
  <title>Payment</title>

  <style>
    body {
      font-family: Arial;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #f5f5f5;
    }

    .box {
      background: white;
      padding: 20px;
      border-radius: 10px;
      width: 300px;
      text-align: center;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }

    input {
      width: 90%;
      padding: 10px;
      margin: 8px 0;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    button {
      padding: 10px;
      width: 100%;
      background: green;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
    }
  </style>
</head>

<body>

<div class="box">
  <h2>💳 Payment</h2>
  <h3>Total: ₹<span id="total">0</span></h3>

  <input placeholder="Card Number">
  <input placeholder="Name on Card">
  <input placeholder="Expiry">
  <input placeholder="CVV">

  <button onclick="pay()">Pay Now</button>
</div>

<script>
let user = localStorage.getItem("user");

if(!user){
  window.location.href = "index.html";
}

// ✅ SAME KEY USE HO RAHA HAI
let cart = JSON.parse(localStorage.getItem("cart_" + user)) || [];

let total = 0;

cart.forEach(p => {
  total += p.price * p.qty;
});

document.getElementById("total").innerText = total;

function pay(){
  if(cart.length === 0){
    alert("Cart empty!");
    return;
  }

  let orders = JSON.parse(localStorage.getItem("orders_" + user)) || [];

  orders.push({
    items: cart,
    total: total,
    date: new Date().toLocaleString()
  });

  localStorage.setItem("orders_" + user, JSON.stringify(orders));

  // cart clear
  localStorage.removeItem("cart_" + user);

  alert("Payment Successful!");

  window.location.href = "order.html";
}
</script>

</body>
</html>

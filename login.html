<!DOCTYPE html>
<html>
<head>
  <title>Login</title>

  <style>
    body {
      font-family: sans-serif;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      background:#f1f3f6;
    }

    .box {
      background:white;
      padding:25px;
      border-radius:10px;
      text-align:center;
    }

    input {
      padding:10px;
      width:200px;
    }

    button {
      margin-top:10px;
      padding:10px;
      width:100%;
      background:orange;
      border:none;
      cursor:pointer;
    }
  </style>
</head>

<body>

<div class="box">
  <h2>Login</h2>
  <input type="text" id="username" placeholder="Enter your name">
  <br>
  <button onclick="login()">Continue</button>
</div>

<script>
function login(){
  let name = document.getElementById("username").value;

  if(name.trim() === ""){
    alert("Enter name");
    return;
  }

  localStorage.setItem("user", name);

  window.location.href = "home.html";
}
</script>

</body>
</html>
